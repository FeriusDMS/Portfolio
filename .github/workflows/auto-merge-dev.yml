name: Auto merge DEV to main

on:
  schedule:
    - cron: '0 3 * * 6'
    - cron: '0 4 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-dev-to-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check Paris time window
        id: time-check
        run: |
          current_day=$(TZ=Europe/Paris date '+%u')
          current_hour=$(TZ=Europe/Paris date '+%H')

          if [[ "$current_day" != "6" || "$current_hour" != "05" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Current Paris time is $(TZ=Europe/Paris date '+%Y-%m-%d %H:%M:%S %Z'); skipping."
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.time-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or refresh pull request
        if: steps.time-check.outputs.skip != 'true'
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const base = 'main';
            const head = 'DEV';

            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${base}...${head}`,
            });

            if (comparison.data.ahead_by === 0) {
              core.info('No commits to merge from DEV into main.');
              core.setOutput('changed', 'false');
              return;
            }

            core.setOutput('changed', 'true');

            const title = 'Auto merge DEV into main';
            const body = 'Automated PR created by the scheduled workflow when DEV has new commits.';

            const { data: openPulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${head}`,
              base,
            });

            let pullRequest = openPulls[0];

            if (!pullRequest) {
              const { data: createdPull } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                head,
                base,
                draft: false,
              });

              pullRequest = createdPull;
              core.info(`Created pull request #${pullRequest.number}.`);
            } else {
              core.info(`Reusing existing pull request #${pullRequest.number}.`);
            }

            try {
              await github.graphql(
                `
                  mutation EnableAutoMerge($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(input: {pullRequestId: $pullRequestId, mergeMethod: MERGE}) {
                      pullRequest {
                        number
                        autoMergeRequest {
                          enabledAt
                        }
                      }
                    }
                  }
                `,
                { pullRequestId: pullRequest.node_id }
              );
              core.info(`Enabled auto-merge for pull request #${pullRequest.number}.`);
            } catch (error) {
              core.warning(`Auto-merge could not be enabled automatically: ${error.message}`);
            }

            core.setOutput('pull_request_number', String(pullRequest.number));
