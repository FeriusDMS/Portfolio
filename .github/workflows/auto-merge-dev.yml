name: Auto merge DEV to main

on:
  schedule:
    - cron: '0 3 * * 6'   # 05h00 CEST (été) / 04h00 CET (hiver)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  merge-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR and merge DEV into main
        id: merge
        uses: actions/github-script@v7
        with:
          script: |
            const base = 'main';
            const head = 'DEV';

            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${base}...${head}`,
            });

            if (comparison.data.ahead_by === 0) {
              core.info('DEV has no new commits compared to main. Nothing to do.');
              core.setOutput('merged', 'false');
              return;
            }

            core.info(`DEV is ${comparison.data.ahead_by} commit(s) ahead of main.`);

            const { data: openPulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${head}`,
              base,
            });

            let pr = openPulls[0];

            if (!pr) {
              const { data: created } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Auto merge DEV into main',
                body: 'Automated weekly merge created by the scheduled workflow.',
                head,
                base,
                draft: false,
              });
              pr = created;
              core.info(`Created pull request #${pr.number}.`);
            } else {
              core.info(`Reusing existing pull request #${pr.number}.`);
            }

            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              merge_method: 'merge',
            });

            core.info(`Pull request #${pr.number} merged successfully into main.`);
            core.setOutput('merged', 'true');

      - name: Pull main after merge
        if: steps.merge.outputs.merged == 'true'
        run: |
          git fetch origin main
          git checkout main
          git pull origin main

      - name: Setup Node
        if: steps.merge.outputs.merged == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.merge.outputs.merged == 'true'
        run: npm install

      - name: Generate patch notes
        if: steps.merge.outputs.merged == 'true'
        run: npm run generate:patch-notes
        env:
          PATCH_NOTES_FROM: ${{ github.sha }}
          PATCH_NOTES_TO: ${{ github.sha }}

      - name: Build
        if: steps.merge.outputs.merged == 'true'
        run: npm run build -- --configuration production --base-href /Portfolio/

      - name: Upload pages artifact
        if: steps.merge.outputs.merged == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/portfolio/browser

      - name: Deploy to GitHub Pages
        if: steps.merge.outputs.merged == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
