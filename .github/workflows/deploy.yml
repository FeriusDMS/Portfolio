name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Auto merge DEV to main"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.decide.outputs.should-deploy }}
    steps:
      - name: Download merge result artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: merge-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Decide whether to deploy
        id: decide
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            if [ -f merge-result.txt ] && [ "$(cat merge-result.txt)" == "true" ]; then
              echo "should-deploy=true" >> $GITHUB_OUTPUT
              echo "Merge detected: deploying."
            else
              echo "should-deploy=false" >> $GITHUB_OUTPUT
              echo "No merge detected: skipping deploy."
            fi
          else
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            echo "Manual or push trigger: deploying."
          fi

  build:
    needs: check
    if: needs.check.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate patch notes
        run: npm run generate:patch-notes
        env:
          PATCH_NOTES_FROM: ${{ github.event.before }}
          PATCH_NOTES_TO: ${{ github.sha }}

      - name: Build
        run: npm run build -- --configuration production --base-href /Portfolio/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/portfolio/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [check, build]
    if: needs.check.outputs.should-deploy == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
