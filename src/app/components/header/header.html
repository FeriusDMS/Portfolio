<header class="header">
  <div class="container">
    <nav class="nav">
      <div class="logo">
        <a routerLink="/" (click)="closeMenu()">
          <span class="logo-text">&lt;Andrea /&gt;</span>
        </a>
      </div>
      
      <ul class="nav-menu" [class.active]="menuActive()">
        <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">{{ translate.translate('nav.home') }}</a></li>
        <li><a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">{{ translate.translate('nav.about') }}</a></li>
        <li><a routerLink="/projects" routerLinkActive="active" (click)="closeMenu()">{{ translate.translate('nav.projects') }}</a></li>
        <li><a routerLink="/skills" routerLinkActive="active" (click)="closeMenu()">{{ translate.translate('nav.skills') }}</a></li>
        <li><a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">{{ translate.translate('nav.contact') }}</a></li>
        <li class="lang-switcher">
          <button (click)="toggleLanguage()" class="lang-btn">
            <span class="flag">{{ translate.currentLang() === 'fr' ? '🇬🇧' : '🇫🇷' }}</span>
            <span class="lang-text">{{ translate.currentLang() === 'fr' ? 'EN' : 'FR' }}</span>
          </button>
        </li>
      </ul>
      
      <div class="nav-actions">
        <button (click)="toggleLanguage()" class="lang-btn-desktop">
          <span class="lang-text">{{ translate.currentLang() === 'fr' ? 'EN' : 'FR' }}</span>
        </button>
        
        <div class="hamburger" (click)="toggleMenu()" [class.active]="menuActive()">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </nav>
  </div>
</header>
