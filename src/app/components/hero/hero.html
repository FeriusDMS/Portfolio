<section class="hero" id="home">
  <div class="container">
    <div class="hero-content fade-in-up">
      <div class="hero-text">
        <p class="greeting">{{ translate.translate('hero.greeting') }}</p>
        <h1 class="name">Andrea</h1>
        <h2 class="title">{{ translate.translate('hero.title') }}</h2>
        <p class="description">
          {{ translate.translate('hero.description') }}
        </p>
        <div class="hero-buttons">
          <a routerLink="/projects" class="btn btn-primary">{{ translate.translate('hero.viewProjects') }}</a>
          <a routerLink="/contact" class="btn btn-outline">{{ translate.translate('hero.contact') }}</a>
        </div>
      </div>
      <div class="hero-image">
        <a routerLink="/about/me" class="image-link" title="{{ translate.translate('aboutDetail.title') }}">
          <div class="image-placeholder">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
            <img src="assets/PP.png" alt="Andrea Mancion" class="profile-photo" />
          </div>
        </a>
      </div>
    </div>
  </div>
</section>
