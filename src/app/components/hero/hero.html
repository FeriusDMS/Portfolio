<section class="hero" id="home">
  <div class="container">
    <div class="hero-content fade-in-up">
      <div class="hero-text">
        <p class="greeting">{{ translate.translate('hero.greeting') }}</p>
        <h1 class="name">Andrea</h1>
        <h2 class="title">{{ translate.translate('hero.title') }}</h2>
        <p class="description">
          {{ translate.translate('hero.description') }}
        </p>
        <div class="hero-buttons">
          <a routerLink="/projects" class="btn btn-primary">{{ translate.translate('hero.viewProjects') }}</a>
          <a routerLink="/contact" class="btn btn-outline">{{ translate.translate('hero.contact') }}</a>
        </div>
      </div>
      <div class="hero-image">
        <div class="image-placeholder">
          <div class="circle circle-1"></div>
          <div class="circle circle-2"></div>
          <div class="circle circle-3"></div>
          <div class="code-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
